name: 🚀 Deploy docs

# Builds the docs on every push to main and publishes them to GitHub Pages.
#
# Pages previously served the docs/ folder committed to this branch, which
# meant the live site only changed when someone remembered to rebuild and
# commit it. It silently fell four days behind. Building here removes that
# step, so docs/ no longer needs to be committed at all.
#
# Set Pages to "GitHub Actions" as its source for this to take effect.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy replaces the whole site, so only one may be in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: "🚀 Build docs"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          # matches packageManager in package.json
          version: 12.4.2

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build:all, not build: a Pages deploy replaces the entire site, so a
      # partial build would drop the frozen v1 docs.
      - name: Build
        run: pnpm --dir website build:all

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: "🚀 Deploy to Pages"
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
