name: ⚡️ Continuous Releases

on:
  push:
    branches:
      - main
  merge_group:
  pull_request:

jobs:
  cr:
    name: "⚡️ Continuous Releases"

    strategy:
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          # matches packageManager in package.json
          version: 12.4.2

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unlike the css repo, this library has a test suite, so a build that
      # fails it is not published as an installable preview.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # pkg.pr.new asks that CI runs it from the lockfile rather than through
      # dlx, so the version is pinned with everything else. Run from the root,
      # it publishes the library only: the docs sites are private.
      - name: Release
        run: pnpm exec pkg-pr-new publish --compact
